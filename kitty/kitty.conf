# ========== Environment ==========
term xterm-kitty

# ========== Mapping ==========
map alt+n send_text all \x1b[D
map alt+u send_text all \x1b[B
map alt+i send_text all \x1b[A
map alt+m send_text all \x1b[C

# ========== Font ==========
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
font_size        11.0

# ========== Cursor ==========
cursor_shape     block
cursor_blink_interval 0.6
cursor_stop_blinking_after 15.0

# ========== Window ==========
window_padding_width 16

# ========== Scrollback ==========
scrollback_lines 5000
scrollback_pager less
scrollback_indicator_opacity 0.0

# ========== Bell ==========
enable_audio_bell yes

# ========== Theme ==========
foreground #D8DEE9
background #2E3440

# Black (Polar Night)
color0  #3B4252
color8  #4C566A

# Red (Aurora - Sharp)
color1  #BF616A
color9  #D06F79

# Green (Aurora - Sharp)
color2  #A3BE8C
color10 #B1D196

# Yellow (Aurora - Sharp)
color3  #EBCB8B
color11 #F3D9A2

# Blue (Frost - Nord Blue Main)
color4  #81A1C1
color12 #81A1C1

# Magenta (Aurora)
color5  #B48EAD
color13 #C895BF

# Cyan (Frost)
color6  #88C0D0
color14 #8FDFE8

# White (Snow Storm)
color7  #E5E9F0
color15 #ECEFF4

# ========== Cursor ==========
cursor #81A1C1
cursor_text_color #2E3440

# ========== Selection ==========
selection_foreground #2E3440
selection_background #81A1C1

# ========== URL ==========
url_color #88C0D0

# ========== Borders ==========
active_border_color   #81A1C1
inactive_border_color #3B4252
bell_border_color     #EBCB8B

# ========== Tabs ==========
active_tab_foreground   #2E3440
active_tab_background   #81A1C1

inactive_tab_foreground #D8DEE9
inactive_tab_background #3B4252

tab_bar_background      #2E3440
