# ~/.config/hypr/hyprlock.conf

general {
    no_fade_in = false
    grace = 0
    disable_loading = true
}

background {
    monitor =
    # Gunakan path ke wallpaper utama atau 'screenshot' untuk efek glass
    path = screenshot 
    color = rgb(26, 27, 38) # #1a1b26
    
    # Efek Blur
    blur_passes = 3 
    blur_size = 7
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

# INPUT FIELD
input-field {
    monitor =
    size = 250, 60
    outline_thickness = 2
    dots_size = 0.2 
    dots_spacing = 0.2
    dots_center = true
    outer_color = rgba(122, 162, 247, 0.6) # Accent #7aa2f7 dengan transparansi
    check_color = rgb(191, 97, 106)  # Nord Red (saat mengecek password)
    fail_color = rgb(191, 97, 106)   # Nord Red (saat salah password)
    capslock_color = rgb(235, 203, 139) # Nord Yellow
    inner_color = rgba(26, 27, 38, 0.3)   # Background dengan transparansi tinggi
    font_color = rgb(192, 202, 245)       # Text #c0caf5
    fade_on_empty = false
    placeholder_text = <span foreground="##c0caf5">~</span>
    hide_input = false
    position = 0, -90
    halign = center
    valign = center
}

# TIME (JAM)
label {
    monitor =
    text = $TIME
    color = rgb(122, 162, 247) # Accent #7aa2f7
    font_size = 90
    font_family = JetBrainsMono Nerd Font Bold
    position = 0, 70
    halign = center
    valign = center
}

# DATE
label {
    monitor =
    text = cmd[update:43200000] echo "$(date +"%A, %d %B %Y")"
    color = rgb(192, 202, 245) # Text color
    font_size = 15
    font_family = JetBrainsMono Nerd Font
    position = 0, 160
    halign = center
    valign = center
}

# BATTERY
label {
    monitor =
    text = cmd[update:1000] echo -e "BAT: $(cat /sys/class/power_supply/BAT0/status | grep -q "Charging" && echo "󱐋 ")$(cat /sys/class/power_supply/BAT0/capacity)%"
    color = rgb(163, 190, 140) # Nord Green
    font_size = 12
    font_family = JetBrainsMono Nerd Font
    position = -25, -20
    halign = right
    valign = top
}

# USER
label {
    monitor =
    # Pakai full path /usr/bin/playerctl dan bungkus dengan bash
    text = kisaragi@senbonzakura
    color = rgba(192, 202, 245, 0.6)
    font_size = 12
    font_family = JetBrainsMono Nerd Font
    position = 0, -20
    halign = center
    valign = center
    zindex = 5
}

# NOW PLAYING
label {
    monitor =
    # Menggabungkan title dan artist tanpa kurung kurawal {{ }}
    text = cmd[update:1000] echo "󰎆  $(playerctl metadata title) - $(playerctl metadata artist)" 2>/dev/null || echo "No Media"
    color = rgba(192, 202, 245, 0.6)
    font_size = 12
    font_family = JetBrainsMono Nerd Font
    position = 0, 80
    halign = center
    valign = bottom
}

# KEYBIND HINT
label {
    monitor =
    text = (super + ,  ;  .)
    color = rgba(192, 202, 245, 0.3) # Warna sangat pudar agar tidak mengganggu
    font_size = 12
    font_family = JetBrainsMono Nerd Font
    position = 0, 38
    halign = center
    valign = bottom
}

