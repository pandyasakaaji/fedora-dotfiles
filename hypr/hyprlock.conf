general {
    no_fade_in = false
    grace = 0
    disable_loading = true
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 7
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.5
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

input-field {
    monitor =
    size = 260, 55
    outline_thickness = 1
    dots_size = 0.22
    dots_spacing = 0.2
    dots_center = true
    outer_color = rgba(129, 161, 193, 0.8)
    inner_color = rgba(46, 52, 64, 0.6)
    font_color = rgb(236, 239, 244)
    check_color = rgb(163, 190, 140)
    fail_color = rgb(191, 97, 106)
    capslock_color = rgb(235, 203, 139)
    fade_on_empty = false
    placeholder_text = <span foreground="##81A1C1">󰌾  password</span>
    hide_input = false
    position = 0, -90
    halign = center
    valign = center
}

# TIME
label {
    monitor =
    text = $TIME
    color = rgb(236, 239, 244)
    font_size = 88
    font_family = JetBrainsMono Nerd Font Bold
    position = 0, 70
    halign = center
    valign = center
    shadow_passes = 3
    shadow_size = 5
    shadow_color = rgba(0, 0, 0, 0.9)
    shadow_boost = 1.2
}

# DATE
label {
    monitor =
    text = cmd[update:43200000] echo "$(date +"%A, %d %B %Y")"
    color = rgba(216, 222, 233, 0.85)
    font_size = 14
    font_family = JetBrainsMono Nerd Font
    position = 0, 160
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(0, 0, 0, 0.9)
}

# USER
label {
    monitor =
    text =   kisaragi@senbonzakura
    color = rgba(129, 161, 193, 0.9)
    font_size = 12
    font_family = JetBrainsMono Nerd Font
    position = 0, -20
    halign = center
    valign = center
    zindex = 5
    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(0, 0, 0, 0.9)
}

# BATTERY
label {
    monitor =
    text = cmd[update:1000] echo -e "$(cat /sys/class/power_supply/BAT0/status | grep -q "Charging" && echo "󱐋 ")$(cat /sys/class/power_supply/BAT0/capacity)%"
    color = rgba(163, 190, 140, 0.9)
    font_size = 12
    font_family = JetBrainsMono Nerd Font
    position = -20, -20
    halign = right
    valign = top
    shadow_passes = 2
    shadow_size = 3
    shadow_color = rgba(0, 0, 0, 0.9)
}

# NOW PLAYING
label {
    monitor =
    text = cmd[update:1000] echo "󰎆  $(playerctl metadata title 2>/dev/null) - $(playerctl metadata artist 2>/dev/null)" || echo ""
    color = rgba(216, 222, 233, 0.7)
    font_size = 12
    font_family = JetBrainsMono Nerd Font
    position = 0, 80
    halign = center
    valign = bottom
    shadow_passes = 2
    shadow_size = 3
    shadow_color = rgba(0, 0, 0, 0.9)
}

# KEYBIND HINT
label {
    monitor =
    text = (super + ,  ;  .)
    color = rgba(216, 222, 233, 0.35)
    font_size = 11
    font_family = JetBrainsMono Nerd Font
    position = 0, 38
    halign = center
    valign = bottom
    shadow_passes = 2
    shadow_size = 3
    shadow_color = rgba(0, 0, 0, 0.9)
}
