[mgr]
# Sorting
sort_by = "natural"
sort_sensitive = false
sort_reverse = false
sort_dir_first = true
sort_translit = false

# Layout & Display (wajib ada agar manager block terisi utuh)
ratio = [1, 3, 4]
show_hidden = false
show_symlink = true
scrolloff = 5
mouse_events = ["click", "scroll"]

[opener]
extract = [{ run = 'unrar x "$1"', desc = "Extract with unrar" }]
